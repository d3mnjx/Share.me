<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111714" />
    <meta
      name="description"
      content="Download a video from a platform link and share a watch page or direct MP4 link. Viewers do not need an account on the original platform."
    />
    <title>Share.me</title>
    <link rel="icon" href="/icon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" sizes="180x180" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Share.me home"
        ><img
          class="brand-mark"
          src="/icon.svg?v=2"
          width="28"
          height="28"
          alt=""
        />Share.me</a
      >
      <div class="header-actions">
        <button
          class="theme-toggle secondary"
          type="button"
          aria-label="Switch to light theme"
        >
          Light theme
        </button>
      </div>
    </header>
    <main class="home">
      <h1>Share videos without a platform account.</h1>
      <p class="intro">
        Paste a video link. Share.me downloads it to this server and creates a
        watch page and a direct MP4 link. Recipients can watch in their browser
        without signing in to the original platform.
      </p>
      <form id="share-form">
        <label for="video-url">Video URL</label>
        <div class="input-row">
          <input
            id="video-url"
            name="url"
            type="url"
            inputmode="url"
            placeholder="https://…"
            required
            maxlength="4096"
            autocomplete="off"
            aria-describedby="form-error limits"
          /><button type="submit" id="submit-button">Download</button>
        </div>
        <p id="form-error" class="error" role="alert" hidden></p>
        <p id="limits" class="limits"></p>
      </form>
      <section
        class="result-panel"
        id="current-share"
        aria-live="polite"
        hidden
      ></section>
      <section class="recent-section" aria-labelledby="recent-heading">
        <div class="section-heading">
          <h2 id="recent-heading">Recent <span id="recent-count">0</span></h2>
          <span>This browser</span>
        </div>
        <div id="recent-list">
          <div class="empty-state"><p>No downloads yet.</p></div>
        </div>
      </section>
    </main>
  </body>
</html>
