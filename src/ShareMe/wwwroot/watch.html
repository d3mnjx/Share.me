<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111714" />
    <title>Shared video — Share.me</title>
    <!-- SHARE_META -->
    <link rel="icon" href="/icon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" sizes="180x180" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/watch.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Share.me home"
        ><img
          class="brand-mark"
          src="/icon.svg?v=2"
          width="28"
          height="28"
          alt=""
        />Share.me</a
      >
      <div class="header-actions">
        <a href="/" class="header-link">New download</a
        ><button
          class="theme-toggle secondary"
          type="button"
          aria-label="Switch to light theme"
        >
          Light theme
        </button>
      </div>
    </header>
    <main class="watch-main">
      <h1 id="video-title">Shared video</h1>
      <div id="watch-status" class="watch-status" role="status">
        Loading video…
      </div>
      <video id="player" controls playsinline preload="metadata" hidden></video>
      <div id="watch-details" hidden>
        <div class="video-details">
          <span id="video-info"></span
          ><a id="source-link" target="_blank" rel="noopener noreferrer"
            >Original post</a
          >
        </div>
        <div class="watch-actions">
          <button id="copy-share">Copy link</button
          ><button class="secondary" id="copy-direct">Copy MP4 link</button
          ><a class="button secondary" id="download-link">Download MP4</a>
        </div>
        <p id="copy-status" class="copy-status" role="status"></p>
      </div>
    </main>
  </body>
</html>
