<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111714" />
    <title>Shared video — Share.me</title>
    <!-- SHARE_META -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/watch.js"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Share.me home"
        ><span class="brand-mark">↗</span>Share<span class="brand-dot">.</span
        >me</a
      >
      <div class="header-actions">
        <a href="/" class="header-link">Share a video ↗</a
        ><button
          class="theme-toggle secondary"
          type="button"
          aria-label="Switch to light theme"
        >
          Light theme
        </button>
      </div>
    </header>
    <main class="watch-main">
      <div class="eyebrow"><span class="little-line"></span>SHARED VIDEO</div>
      <h1 id="video-title">Shared video</h1>
      <div id="watch-status" class="watch-status" role="status">
        Loading video…
      </div>
      <video id="player" controls playsinline preload="metadata" hidden></video>
      <div id="watch-details" hidden>
        <div class="video-details">
          <span id="video-info"></span
          ><a id="source-link" target="_blank" rel="noopener noreferrer"
            >View original post ↗</a
          >
        </div>
        <div class="watch-actions">
          <button id="copy-share">Copy watch-page link ↗</button
          ><button class="secondary" id="copy-direct">
            Copy direct MP4 link</button
          ><a class="button secondary" id="download-link">Download MP4 ↓</a>
        </div>
        <p id="copy-status" class="copy-status" role="status"></p>
      </div>
      <p class="watch-footnote">
        This video is served from this Share.me instance. No account on the
        original platform is needed to watch.
      </p>
    </main>
    <footer>
      <a class="brand small" href="/">Share<span class="brand-dot">.</span>me</a
      ><span>Download videos. Share watch pages and MP4 links.</span
      ><span>STORED ON THIS SERVER</span>
    </footer>
  </body>
</html>
