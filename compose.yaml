services:
  share-to:
    build:
      context: .
      args:
        YT_DLP_VERSION: ${YT_DLP_VERSION:-2026.08.19}
    image: share-to:local
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:8080"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-}
      MAX_FILE_MB: ${MAX_FILE_MB:-250}
      MAX_STORAGE_MB: ${MAX_STORAGE_MB:-10240}
      MAX_DURATION_MINUTES: ${MAX_DURATION_MINUTES:-20}
      DOWNLOAD_TIMEOUT_SECONDS: ${DOWNLOAD_TIMEOUT_SECONDS:-900}
    volumes:
      - share-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      # yt-dlp's standalone distribution unpacks native libraries here.
      - /tmp:rw,exec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  share-data:
